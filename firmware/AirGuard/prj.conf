CONFIG_BT=y
CONFIG_BT_OBSERVER=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Set to y while debugging nearby Apple devices. It prints Apple manufacturer
# payloads that do not pass the AirTag-class filter.
CONFIG_AIRGUARD_DEBUG_APPLE_PAYLOADS=y
